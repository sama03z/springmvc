
name: Spring MVC Docker CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# 동일 Repository에서 버전 충돌 방지
concurrency:
  group: springmvc-docker-publish
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 소스 다운로드
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Java 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Maven 빌드
      - name: Build application
        run: mvn -B clean verify

      # 4. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Docker Hub 최신 버전 조회 및 증가
      - name: Calculate version
        id: version
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO="springmvc"
          BASE_VERSION="1.0"
          INITIAL_PATCH=1

          # Docker Hub API 인증 토큰 발급
          AUTH=$(curl -fsS \
            -H "Content-Type: application/json" \
            -d "$(jq -nc \
              --arg u "$DOCKERHUB_USERNAME" \
              --arg p "$DOCKERHUB_TOKEN" \
              '{username:$u,password:$p}')" \
            https://hub.docker.com/v2/users/login/)

          HUB_TOKEN=$(echo "$AUTH" | jq -r '.token // empty')

          if [ -z "$HUB_TOKEN" ]; then
            echo "Docker Hub API authentication failed"
            exit 1
          fi

          # Docker Hub 태그 전체 페이지 조회
          URL="https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${REPO}/tags?page_size=100"
          ALL_TAGS=""

          while [ -n "$URL" ]; do
            RESPONSE=$(curl -fsS \
              -H "Authorization: JWT ${HUB_TOKEN}" \
              "$URL")

            PAGE_TAGS=$(echo "$RESPONSE" |
              jq -r '.results[].name')

            ALL_TAGS="${ALL_TAGS}"$'\n'"${PAGE_TAGS}"

            URL=$(echo "$RESPONSE" | jq -r '.next // empty')
          done

          # 1.0.x 형식의 태그만 검색
          LAST_TAG=$(printf '%s\n' "$ALL_TAGS" |
            grep -E '^1\.0\.[0-9]+$' |
            sort -V |
            tail -n 1 || true)

          if [ -z "$LAST_TAG" ]; then
            NEW_TAG="${BASE_VERSION}.${INITIAL_PATCH}"
          else
            PATCH=${LAST_TAG##*.}
            NEW_TAG="${BASE_VERSION}.$((10#$PATCH + 1))"
          fi

          echo "Last version: ${LAST_TAG:-none}"
          echo "New version: ${NEW_TAG}"

          echo "VERSION=$NEW_TAG" >> "$GITHUB_OUTPUT"

      # 6. Docker Buildx 준비
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 7. Docker Image 빌드 및 Push
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/springmvc:latest
            ${{ vars.DOCKERHUB_USERNAME }}/springmvc:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 8. 배포 결과 출력
      - name: Print image information
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          echo "======================================"
          echo "Docker Image Published Successfully"
          echo "======================================"
          echo "Image: ${DOCKERHUB_USERNAME}/springmvc"
          echo "Version: ${VERSION}"
          echo "======================================"
